---
name: '📦 Create New Release'

on:
  push:
    branches:
      - master

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write
  deployments: write

concurrency:
  group: release-master-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ✅ Check for Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧪 Check out repository code
        uses: ./.github/workflows/health-check
        with:
          run-tests: true
          run-tests-command: 'pnpm exec nx affected --target=test'
          run-lint: false
          run-lint-command: 'pnpm exec nx affected --target=lint'
          run-build: true
          run-build-command: 'pnpm exec nx affected --target=build'

  release:
    name: 📦 Release Version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - checks

    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Push over SSH so the release commit and tags go through the deploy key, a ruleset bypass actor
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🖥️ Setup Env
        uses: ./.github/workflows/install

      - name: Release
        timeout-minutes: 2
        continue-on-error: true
        env:
          # A PAT, not the built-in token - releases it creates must still trigger update-shortcuts-version
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          pnpm exec nx release --first-release
