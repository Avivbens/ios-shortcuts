---
name: '☑️ Checks Pipeline'
description: 'Checks the codebase health'

inputs:
  run-tests-command:
    description: 'Run tests command, default is `pnpm test`'
    default: 'pnpm test'
    required: false

  run-tests:
    description: 'Run tests'
    default: 'true'
    required: false

  run-lint-command:
    description: 'Run linter command, default is `pnpm run lint`'
    default: 'pnpm run lint'
    required: false

  run-lint:
    description: 'Run lint'
    default: 'true'
    required: false

  run-build-command:
    description: 'Run build command, default is `pnpm run build`'
    default: 'pnpm run build'
    required: false

  run-build:
    description: 'Run build'
    default: 'true'
    required: false

  run-typecheck-command:
    description: 'Run typecheck command, default is `pnpm exec nx run-many --target=typecheck`'
    default: 'pnpm exec nx run-many --target=typecheck'
    required: false

  run-typecheck:
    description: 'Run typecheck, off unless a workflow asks for it'
    default: 'false'
    required: false

runs:
  using: composite
  steps:
    - name: 🖥️ Setup Env
      uses: ./.github/workflows/install

    - name: 🧪 Test
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      run: |
        ${{ inputs.run-tests-command }}

    - name: 🔨 Build
      if: ${{ inputs.run-build == 'true' }}
      shell: bash
      run: |
        ${{ inputs.run-build-command }}

    - name: ✅ Lint
      if: ${{ inputs.run-lint == 'true' }}
      shell: bash
      run: |
        ${{ inputs.run-lint-command }}

    - name: 🔎 Typecheck
      if: ${{ inputs.run-typecheck == 'true' }}
      shell: bash
      run: |
        ${{ inputs.run-typecheck-command }}
